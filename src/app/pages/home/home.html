<div class="w-screen  overflow-hidden flex flex-col gap-4">
  <h1 class="text-5xl font-bold w-3/4  text-neutral-800 p-4 mx-auto flex justify-center h-32 items-center border-b-2 border-zinc-300">
    Skyblock To-Do
  </h1>

  <form (ngSubmit)="addTarefa()" [formGroup]="formulario" class="w-3/4 mx-auto bg-zinc-50 shadow-lg rounded-lg flex flex-col justify-center gap-4 p-4">
    <div class="flex flex-col gap-4 w-full p-4">

      <div class="flex gap-8 w-full">
        <div class="flex flex-col gap-1 w-1/2">
          <label for="inputTitle" class="block text-xl font-semibold text-heading">Titulo</label>
          <input type="text" title="inputTitle" id="inputTitle" formControlName="tarefaTitle" placeholder="item ou objetivo" class="placeholder:font-normal w-full border-2 border-zinc-300 rounded-md p-2 shadow-md active:outline-none focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:placeholder:font-semibold transition-all duration-300">
        </div>
        <div class="flex flex-col gap-1 w-1/2">
          <label for="inputDataCriation" class="block text-xl font-semibold text-heading">Data de criação</label>
          <input type="date" title="inputDataCriation" id="inputDataCriation" formControlName="dataCriation" class="placeholder:font-normal w-full border-2 border-zinc-300 rounded-md p-2 shadow-md active:outline-none focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:placeholder:font-semibold transition-all duration-300">
        </div>
      </div>

      <div class="flex w-full flex-col gap-1">
        <label for="inputDescription" class="block text-xl font-semibold text-heading">Descrição</label>
        <input type="text" title="inputDescription" formControlName="tarefaDescription" placeholder="descreva o que você deseja fazer ou ter..." class="placeholder:font-normal w-full border-2 border-zinc-300 rounded-md p-2 shadow-md active:outline-none focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:placeholder:font-semibold transition-all duration-300">
      </div>
    </div>

    <div class="flex gap-4 w-full p-4 justify-end">
      <button title="cancelarTarefa" type="button" (click)="cancelarFormulario()" class="w-2/9 bg-zinc-300 hover:bg-zinc-400 hover:text-zinc-700 text-zinc-600 font-semibold py-3 px-4 rounded-md shadow-md transition-all duration-300">
        Cancelar
      </button>
      <button title="addTarefa" type="submit" class=" w-2/9  bg-zinc-400 hover:bg-zinc-500 hover:text-zinc-800 text-zinc-700 font-semibold py-3 px-4 rounded-md shadow-md transition-all duration-300">
        Adiconar tarefa
      </button>
    </div>
  </form>

  <div class="w-3/4 mx-auto bg-zinc-50 shadow-lg rounded-lg flex flex-col justify-center gap-2 p-4 mb-4">

    <div class="flex gap-1 w-full justify-center bg-red-500 ">
      <button
        *ngFor="let tipo of types" type="button" [title]="getTipoNome(tipo.name)">
        <fa-icon [icon]="typesIcons[tipo.name]" >
        </fa-icon>
        <span>
          {{ getTipoNome(tipo.name) }}
        </span>

      </button>
    </div>

    <ol class="w-full" *ngIf="tarefas.length > 0">
        <li *ngFor="let tarefa of tarefas; let i = index" class="flex flex-col p-4">
          <div class="flex justify-between items-center bg-zinc-300 p-4 rounded-md shadow-md"
          [ngClass]="{'rounded-b-none': mostrarTarefa}"
          >
            <h2 class="text-2xl font-bold text-heading tracking-wide">
              {{ tarefa.title }}
            </h2>
            <div class="flex gap-4 items-center">
              <h3 class="text-lg font-semibold text-heading text-end">
              {{ tarefa.dataCriation }}
              </h3>
              <fa-icon *ngIf="!mostrarTarefa" class="w-8 h-8 flex justify-center items-center border-2 hover:border-zinc-600 hover:bg-zinc-500 transition-all duration-300 border-zinc-500 bg-zinc-400 rounded-sm shadow-sm"
              (click)="verTarefa(tarefa)"
              [icon]="faEye"
              >
              </fa-icon>
              <fa-icon *ngIf="mostrarTarefa" class="w-8 h-8 flex justify-center items-center border-2 hover:border-zinc-600 hover:bg-zinc-500 transition-all duration-300 border-zinc-500 bg-zinc-400 rounded-sm shadow-sm"
              (click)="verTarefa(tarefa)"
              [icon]="faEyeSlash"
              >
              </fa-icon>
            </div>
          </div>
          <div *ngIf="mostrarTarefa" class="text-lg font-normal border-2 border-zinc-300 flex flex-col gap-8 rounded-b-md p-4 shadow-md">
            <p class="flex flex-col">
              <span class="font-light text-sm">Descrição:</span>
              <span class="font-normal text-base pl-2">
                {{ tarefa.description }}
              </span>
            </p>
            <div class="flex gap-4 justify-end mr-2">
              <button type="button" class="bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-md transition-colors duration-300">
                excluir
              </button>
              <button type="button" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-md transition-colors duration-300">
                editar
              </button>
              <button type="button" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-md transition-colors duration-300">
                concluir
              </button>
            </div>
          </div>
        </li>
    </ol>
  </div>
</div>
