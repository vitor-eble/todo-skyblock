<div class="h-screen flex flex-col overflow-hidden">
  <ion-header>
    <ion-toolbar>
      <span class="flex items-center">
        <button aria-label="open-menu" type-button (click)="toggleMenu()">
          <fa-icon [icon]="faBars" class="text-3xl text-heading px-4"></fa-icon>
        </button>
        <ion-title class="text-2xl font-semibold  tracking-wide">SkyTrack</ion-title>
      </span>
    </ion-toolbar>
  </ion-header>

  <app-menu-lateral
    (fecharMenu)="menuAberto = false"
    [menuAberto]="menuAberto"
    (tipoObjetivoSelecionado)="abrirTipo($event)"
  >
  </app-menu-lateral>

  <app-criar-objetivo
  (fecharModalObjetivo)="criarObjetivoModal = false"
  [criarObjetivoModal]="criarObjetivoModal"
  >
  </app-criar-objetivo>

  <ion-content [fullscreen]="true" class="ion-padding overflow-y-auto flex-1">

    <router-outlet></router-outlet>

  </ion-content>
  <ion-footer class="py-3 fixed bottom-0">
    <ion-toolbar>
      <div class="flex justify-around items-center w-full fixed bottom-0">
        <button aria-label="open-modal" type="button" (click)="toggleModal()"
          class="bg-zinc-500 active:bg-zinc-600 text-white font-semibold flex justify-center items-center h-14 w-14 rounded-full  transition-all duration-300"
        >
          <fa-icon [icon]="faPlus"></fa-icon>
        </button>
      </div>
    </ion-toolbar>
  </ion-footer>
</div>
