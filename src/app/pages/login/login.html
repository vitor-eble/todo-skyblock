<ion-content class="">
  <div class="h-dvh flex flex-col justify-center items-center  bg-zinc-100 p-4">
    <div class="border-2 border-zinc-400 rounded-md shadow-md flex flex-col justify-center items-center bg-white w-full gap-2 p-4">
      <ion-header [translucent]="true" class="ion-no-border">
        <ion-toolbar>
          <ion-title class="text-2xl font-bold text-heading tracking-wide px-2">
            Login
          </ion-title>
        </ion-toolbar>
      </ion-header>

      <form class="flex flex-col mt-4">

        <div class="flex flex-col gap-4">
          <app-input-component
            tipe="text"
            title="Email"
            placeholder="exemplo@gmail.com"
            [icon]="faEnvelope"
          >
          </app-input-component>

          <app-input-component
            tipe="password"
            title="senha"
            placeholder="senha"
            [icon]="faLock"
            ariaLabel="senha"
          >
          </app-input-component>
        </div>
        
        <div class="flex justify-end text-sm text-zinc-500 mt-2 mb-4">
          esqueceu a senha?
        </div>

        <div class="flex justify-center my-4">
          <button (click)="login()" type="submit" class="p-4 w-full bg-zinc-500 text-white font-semibold rounded-md shadow-md hover:bg-zinc-900 transition-all duration-300">
            Login
          </button>
        </div>
      </form>
    </div>
    <span class="text-sm text-zinc-500 mt-4">
      nao tem uma conta?
      <a href="" class="text-zinc-900 font-semibold hover:underline">
        cadastre-se 
      </a>
    </span>
  </div>
</ion-content>
