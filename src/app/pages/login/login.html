<ion-content class="">
  <div class="h-dvh flex flex-col justify-center items-center bg-zinc-100 p-4">
    <div class="border-2 border-zinc-400 rounded-md shadow-md flex flex-col justify-center items-center bg-white w-full gap-2 p-4">
      <ion-header [translucent]="true" class="ion-no-border">
        <ion-toolbar>
          <ion-title class="text-2xl font-bold text-heading tracking-wide px-2">
            Login
          </ion-title>
        </ion-toolbar>
      </ion-header>

      <form class="flex flex-col gap-4">
        <div>
          <label
            for="visitors"
            class="flex items-center gap-2 border-zinc-300 border-2 text-sm rounded-sm w-full p-4 shadow-xs text-zinc-700 focus-within:ring-2 focus-within:ring-zinc-500"
          >
            <fa-icon [icon]="faEnvelope" class="text-zinc-400"></fa-icon>
            <input
              type="text"
              id="visitors"
              class="w-full outline-none placeholder:text-sm placeholder:text-zinc-400"
              placeholder="exemplo@mail.com"
              required
            />
          </label>
        </div>

        <div>
          <label for="visitors" class="block text-sm font-medium text-heading">Email</label>
          <input type="text" id="visitors" class="border-zinc-300 border-b text-heading text-sm block w-full px-2.5 py-3 placeholder:text-body focus:outline-none" placeholder="" required />
        </div>

        <ion-item>
          <ion-label position="floating">Senha</ion-label>
          <ion-input type="password"></ion-input>
        </ion-item>

        <div class="flex justify-center">
          <button type="submit" class="p-4 w-full bg-zinc-500 text-white font-semibold rounded-md shadow-md hover:bg-zinc-900 transition-all duration-300">
            Login
          </button>
        </div>
      </form>
    </div>
  </div>
</ion-content>
