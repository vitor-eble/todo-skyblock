<div class="fixed inset-0 bg-black/40 z-40" *ngIf="criarObjetivoModal">
  <ion-header>
            <ion-toolbar>
                <span class="w-full gap-8 flex justify-between">
                    <ion-buttons slot="start">
                        <ion-button (click)="fecharModal()">Cancelar</ion-button>
                    </ion-buttons>
                    <ion-title class="text-2xl font-semibold tracking-wide">Criar Objetivo</ion-title>
                    <ion-buttons slot="end">
                        <ion-button type="submit" (click)="addTarefa()" [strong]="true">Criar</ion-button>
                    </ion-buttons>
                </span>
            </ion-toolbar>
        </ion-header>
    <div class="bg-zinc-100 min-h-full p-4" (click)="$event.stopPropagation()">
      <form
        /* (ngSubmit)="" */
        [formGroup]="formulario"
        class="mx-auto bg-white shadow-lg rounded-lg flex flex-col justify-center gap-4 border-2 border-zinc-400"
      >
        <div class="flex flex-col gap-4 w-full p-4">
          <div class="flex gap-8 w-full">
            <div class="flex flex-col gap-1 w-1/2">
              <label for="inputTitle" class="block text-xl font-semibold text-heading"
                >Titulo</label
              >
              <input
                label="Titulo"
                type="text"
                title="inputTitle"
                id="inputTitle"
                formControlName="tarefaTitle"
                placeholder="item ou objetivo"
                class="placeholder:font-normal w-full border-2 border-zinc-300 rounded-md p-2 shadow-md active:outline-none focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:placeholder:font-semibold transition-all duration-300"
              />
            </div>
            <div class="flex flex-col gap-1 w-1/2">
              <label for="inputDataCriation" class="block text-xl font-semibold text-heading"
                >Data de criação</label
              >
              <input
                type="date"
                title="inputDataCriation"
                id="inputDataCriation"
                formControlName="dataCriation"
                class="placeholder:font-normal w-full border-2 border-zinc-300 rounded-md p-2 shadow-md active:outline-none focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:placeholder:font-semibold transition-all duration-300"
              >
            </div>
          </div>

          <div class="flex w-full flex-col gap-1">
            <label for="inputDescription" class="block text-xl font-semibold text-heading"
              >Descrição</label
            >
            <input
              type="text"
              title="inputDescription"
              formControlName="tarefaDescription"
              placeholder="descreva o que você deseja fazer ou ter..."
              class="placeholder:font-normal w-full border-2 border-zinc-300 rounded-md p-2 shadow-md active:outline-none focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:placeholder:font-semibold transition-all duration-300"
            />
          </div>
        </div>

        <div class="flex gap-4 w-full p-4 justify-end">
          <!-- <button
            title="cancelarTarefa"
            type="button"
            (click)="cancelarFormulario()"
            class="w-2/9 bg-zinc-300 hover:bg-zinc-400 hover:text-zinc-700 text-zinc-600 font-semibold py-3 px-4 rounded-md shadow-md transition-all duration-300"
          >
            Cancelar
          </button> -->
          <!-- <button
            title="addTarefa"
            type="submit"
            class="w-2/9 bg-zinc-400 hover:bg-zinc-500 hover:text-zinc-800 text-zinc-700 font-semibold py-3 px-4 rounded-md shadow-md transition-all duration-300"
          >
            Adiconar tarefa
          </button> -->
        </div>
      </form>
    </div>
</div>
